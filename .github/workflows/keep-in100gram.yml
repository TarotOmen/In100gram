name: Keep Render Services Alive (In100gram + Tarot)

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-in100gram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping In100gram Render
        run: >-
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n'
          --connect-timeout 20 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10
          https://ln100gram-new-z3ul.onrender.com
  ping-tarot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping Tarot Render
        run: >-
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n'
          --connect-timeout 20 --max-time 90 --retry 5 --retry-all-errors --retry-delay 10
          https://tarot-omen1-new-hfhf.onrender.com/health
